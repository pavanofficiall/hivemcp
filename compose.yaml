name: hive-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the local setup script first}
      POSTGRES_DB: hive
    ports: ['127.0.0.1:54329:5432']
    volumes: ['./.hive/postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hive -d hive']
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:63799:6379']
    volumes: ['./.hive/redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20
